[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-policy-grounding"
version = "0.1.0"
description = "Neuro-symbolic (Datalog + z3) grounding gate for GCP IAM / Org Policy and the Terraform that generates them"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
z3 = ["z3-solver"]
dev = ["pytest", "z3-solver"]

[project.scripts]
gcp-ground = "gcp_grounding.cli:main"

[tool.setuptools.packages.find]
include = ["gcp_grounding*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every xfail in this suite is an ESCALATION: it names the clause it cannot
# satisfy, and the day that clause is satisfiable it must XPASS and go RED so the
# escalation is retired deliberately rather than by rot. Each marker passes
# strict=True today; this makes the default strict as well, so a future marker
# that omits it is not silently non-strict (audit row R41).
xfail_strict = true
